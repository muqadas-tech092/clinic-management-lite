<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#087F8C" />
  <meta name="description" content="Appointments, token queue, consultations, prescriptions, billing, inventory and reports for small clinics. Runs entirely in the browser." />
  <title>Clinic Management Lite</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="config.js"></script>
</head>
<body>
  <div id="login" class="login-screen" hidden></div>

  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="brand" id="brand"></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
      <button class="sidebar-collapse icon-btn" id="collapseBtn" type="button" aria-label="Collapse sidebar"></button>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu"></button>
        <div class="search" id="searchWrap">
          <span class="search-icon" id="searchIcon"></span>
          <input id="globalSearch" type="search" autocomplete="off" />
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <div class="top-meta" id="topMeta"></div>
        <div class="lang-switch" id="langSwitch">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ur">اردو</button>
        </div>
        <div class="profile" id="profile"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
    </div>
  </div>

  <div id="loading" class="loading-screen">
    <img src="assets/logo.svg" alt="" width="56" height="56" />
    <div class="spinner"></div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="printRoot" class="print-root" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
